# Спільні налаштування (завжди завантажуються).
education:
  chat:
    # Під час профілю "mongo" нижче буде true. Без "mongo" — чат на Mongo вимкнено (Railway без Atlas).
    mongodb-enabled: false

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/school_chat}
      database: school_chat
      auto-index-creation: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:schools}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    repair-on-migrate: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 28MB

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-must-be-at-least-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

logging:
  level:
    root: INFO
    com.education.web: DEBUG

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    merge-localhost: ${CORS_MERGE_LOCALHOST:true}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  homework-upload:
    dir: ${HOMEWORK_UPLOAD_DIR:${java.io.tmpdir}/education-homework}
  super-admin:
    email: ${SUPER_ADMIN_EMAIL:superadmin@education.local}
    bootstrap-password: ${SUPER_ADMIN_PASSWORD:123456}

---
# Профіль "mongo" НЕ активний: повністю вимикаємо Mongo auto-config (надійніше за EnvironmentPostProcessor у проді).
spring:
  config:
    activate:
      on-profile: "!mongo"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

---
# Увімкнути чат на Atlas/Mongo: SPRING_PROFILES_ACTIVE=mongo (+ змінна MONGODB_URI на проді).
spring:
  config:
    activate:
      on-profile: "mongo"
education:
  chat:
    mongodb-enabled: true
